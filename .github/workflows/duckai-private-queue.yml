name: Duck.ai Private Queue

on:
  push:
    branches:
      - duckai
    paths:
      - ".private-queue/start/*.json"

permissions:
  contents: read

concurrency:
  group: duckai-private-queue
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == 'duckai'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      PRIVATE_TARGET_JOB_ID: ${{ secrets.DUCKAI_TARGET_JOB_ID }}
      PRIVATE_TARGET_ROW_JSON: ${{ secrets.DUCKAI_TARGET_ROW_JSON }}
    steps:
      - name: Check out the Duck.ai pipeline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate the opaque start marker
        id: validate_marker
        env:
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! "$PRIVATE_TARGET_JOB_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "The active private job ID is missing or invalid."
            exit 1
          fi
          marker=".private-queue/start/${PRIVATE_TARGET_JOB_ID}.json"
          if ! git show "${PUSH_SHA}:${marker}" > "${RUNNER_TEMP}/start-marker.json"; then
            echo "The start marker is missing from the triggering commit."
            exit 1
          fi
          marker_job_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("job_id", ""))' "${RUNNER_TEMP}/start-marker.json")"
          if [[ "$marker_job_id" != "$PRIVATE_TARGET_JOB_ID" ]]; then
            echo "The start marker does not match the active private job."
            exit 1
          fi
          if [[ "${marker##*/}" != "${marker_job_id}.json" ]]; then
            echo "The start marker filename does not match its job ID."
            exit 1
          fi
          echo "JOB_ID=$marker_job_id" >> "$GITHUB_ENV"
          echo "SITE_INDEX=1" >> "$GITHUB_ENV"

      - name: Check out private input records
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: duckai
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-source
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: private_automation/queue/

      - name: Check out legacy private input records
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: main
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-source-main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: private_automation/queue/

      - name: Load and mask private target fields
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, uuid
          from pathlib import Path
          from urllib.parse import urlparse
          raw = os.environ.get("PRIVATE_TARGET_ROW_JSON", "")
          row = json.loads(raw)
          if not isinstance(row, dict):
              raise SystemExit("The private target row is invalid.")
          normalized = {}
          for key, value in row.items():
              name = re.sub(r"[^A-Za-z0-9_]", "_", str(key).strip()).upper()
              if not name or name[0].isdigit():
                  name = "FIELD_" + name
              if name in normalized:
                  raise SystemExit("The private target contains colliding CSV column names.")
              value = " ".join(str(value or "").split())
              normalized[name] = value
              if value:
                  print(f"::add-mask::{value}")
          required = ("WEBSITE", "BUSINESS", "CATEGORY")
          if any(not normalized.get(key) for key in required):
              raise SystemExit("The private target row is missing a required field.")
          website = normalized["WEBSITE"]
          parsed = urlparse(website)
          if parsed.scheme not in {"http", "https"} or not parsed.hostname or any(char.isspace() for char in website):
              raise SystemExit("The private target website must use HTTP or HTTPS.")
          aliases = {
              "SOURCE_URL": normalized["WEBSITE"],
              "BUSINESS_NAME": normalized["BUSINESS"],
              "INDUSTRY_CATEGORY": normalized["CATEGORY"],
              "LOCATION": normalized.get("LOCATION", ""),
          }
          job_path = Path("private-source/private_automation/queue/jobs") / f"{os.environ.get('PRIVATE_TARGET_JOB_ID', '')}.json"
          source_root = Path("private-source")
          if not job_path.is_file():
              source_root = Path("private-source-main")
              job_path = source_root / "private_automation/queue/jobs" / f"{os.environ.get('PRIVATE_TARGET_JOB_ID', '')}.json"
          job = json.loads(job_path.read_text(encoding="utf-8"))
          if job.get("job_id") != os.environ.get("PRIVATE_TARGET_JOB_ID") or job.get("provider") != "duckai" or job.get("row") != row:
              raise SystemExit("The private Duck.ai job record does not match the active target.")
          continuation = job.get("continuation", {})
          if not isinstance(continuation, dict):
              continuation = {}
          candidate_attempt_limit = int(job.get("candidate_attempt_limit", 12) or 12)
          if not 1 <= candidate_attempt_limit <= 12:
              raise SystemExit("The private Duck.ai candidate attempt limit must be from 1 to 12.")
          prior_passes = int(continuation.get("successful_candidates", 0) or 0)
          prior_attempts = int(continuation.get("attempts", 0) or 0)
          if continuation.get("parent_job_id") and (prior_attempts != 12 or not 0 <= prior_passes < 3):
              raise SystemExit("The Duck.ai continuation record is outside the 12/24-attempt bounds.")
          aliases.update({
              "PRIOR_JOB_ID": str(continuation.get("parent_job_id", "")),
              "PRIOR_RUN_ID": str(continuation.get("parent_run_id", "")),
              "PRIOR_SUCCESSFUL_CANDIDATES": str(prior_passes),
              "PRIOR_ATTEMPTS": str(prior_attempts),
              "CANDIDATE_ATTEMPT_LIMIT": str(candidate_attempt_limit),
          })
          aliases.update({f"CSV_FIELD_{key}": value for key, value in normalized.items()})
          aliases["PRIVATE_SOURCE_ROOT"] = str(source_root)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for name, value in aliases.items():
                  delimiter = "GIT_CONTENT_" + uuid.uuid4().hex
                  while delimiter in value:
                      delimiter = "GIT_CONTENT_" + uuid.uuid4().hex
                  handle.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PY
          echo "::add-mask::$PRIVATE_TARGET_JOB_ID"
          echo "Loaded the private row for the requested run."

      - name: Install Playwright dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-playwright.txt

      - name: Check out private input records for live checkpoints
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: main
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-source-live
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: private_automation/queue/

      - name: Check out private Duck.ai evidence branch before generation
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: duckai
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-results
          fetch-depth: 0

      - name: Resolve private result slug
        if: steps.validate_marker.outcome == 'success'
        run: |
          set -euo pipefail
          result_slug="$(python - "$JOB_ID" <<'PY'
          import json, os, pathlib, re, sys
          source_root = pathlib.Path(os.environ.get("PRIVATE_SOURCE_ROOT", "private-source"))
          path = source_root / "private_automation/queue/jobs" / f"{sys.argv[1]}.json"
          job = json.loads(path.read_text(encoding="utf-8"))
          if job.get("job_id") != sys.argv[1] or job.get("provider", "duckai") != "duckai":
              raise SystemExit("The private job record is invalid for Duck.ai.")
          slug = job.get("result_slug", "")
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("The private target has no valid result slug.")
          batch_limit = job.get("candidate_attempt_limit", 12)
          if isinstance(batch_limit, bool) or not isinstance(batch_limit, int) or not 1 <= batch_limit <= 12:
              raise SystemExit("The private candidate attempt limit must be an integer from 1 to 12.")
          continuation = job.get("continuation", {})
          if not isinstance(continuation, dict):
              continuation = {}
          prior_passes = int(continuation.get("successful_candidates", 0) or 0)
          prior_attempts = int(continuation.get("attempts", 0) or 0)
          parent_id = str(continuation.get("parent_job_id", ""))
          parent_run = str(continuation.get("parent_run_id", ""))
          if parent_id and (prior_attempts != 12 or not 0 <= prior_passes < 3 or batch_limit + prior_attempts > 24):
              raise SystemExit("The Duck.ai continuation record is outside the 12/24-attempt bounds.")
          if not parent_id and (prior_attempts or prior_passes):
              raise SystemExit("Prior candidate counts require a valid continuation parent.")
          print(slug)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"CANDIDATE_ATTEMPT_LIMIT={batch_limit}\n")
              env.write(f"PRIOR_SUCCESSFUL_CANDIDATES={prior_passes}\n")
              env.write(f"PRIOR_ATTEMPTS={prior_attempts}\n")
              env.write(f"PRIOR_JOB_ID={parent_id}\n")
              env.write(f"PRIOR_RUN_ID={parent_run}\n")
          PY
          )"
          echo "RESULT_SLUG=$result_slug" >> "$GITHUB_ENV"

      - name: Generate candidate sites
        id: generate
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          successful="${PRIOR_SUCCESSFUL_CANDIDATES:-0}"
          attempt="${PRIOR_ATTEMPTS:-0}"
          prior_attempts="$attempt"
          target=3
          batch_limit="${CANDIDATE_ATTEMPT_LIMIT:-12}"
          max_total_attempts=$((prior_attempts + batch_limit))
          if [[ -n "${PRIOR_JOB_ID:-}" ]]; then
            python duckai_automation/scripts/continuation.py inherit \
              --results-root private-results/results \
              --destination-root duckai-runs \
              --parent-job-id "$PRIOR_JOB_ID" --parent-run-id "${PRIOR_RUN_ID:-0}" \
              --expected-passes "$successful" \
              --current-run-id "$GITHUB_RUN_ID" --current-run-attempt "$GITHUB_RUN_ATTEMPT"
            successful="$(python duckai_automation/scripts/continuation.py pass-count --candidates-dir duckai-runs)"
          fi
          checkpoint_candidate() {
            local run_dir="$1"
            local candidate_name relative_candidate
            candidate_name="$(basename "$run_dir")"
            relative_candidate="results/${RESULT_SLUG}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/candidates/${candidate_name}"
            git -C private-results config user.name "github-actions[bot]"
            git -C private-results config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for retry in 1 2 3 4 5; do
              git -C private-results fetch origin duckai || { sleep 2; continue; }
              git -C private-results reset --hard origin/duckai || return 1
              mkdir -p "private-results/$(dirname "$relative_candidate")"
              rm -rf "private-results/$relative_candidate"
              cp -R "$run_dir" "private-results/$relative_candidate" || return 1
              local result_dir="private-results/results/${RESULT_SLUG}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              python - "$result_dir/status.json" "$JOB_ID" "$successful" "$attempt" <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps({
              "job_id": sys.argv[2], "status": "in_progress",
              "successful_candidates": int(sys.argv[3]), "attempts": int(sys.argv[4]),
              "public_workflow_run": int(os.environ["GITHUB_RUN_ID"]),
          }, indent=2) + "\n", encoding="utf-8")
          PY
              python private-results/private_automation/scripts/build_results_index.py || return 1
              git -C private-results add -- "$relative_candidate" "results/${RESULT_SLUG}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/status.json" || return 1
              git -C private-results add -- results/README.md results/successful.csv || return 1
              if git -C private-results diff --cached --quiet; then
                echo "Candidate evidence already exists on the private duckai branch: $candidate_name"
                return 0
              fi
              if ! git -C private-results commit -m "private: checkpoint Duck.ai candidate ${JOB_ID} ${candidate_name} [skip ci]"; then
                echo "Could not create the candidate checkpoint commit."
                return 1
              fi
              if git -C private-results push origin "HEAD:refs/heads/duckai"; then
                echo "Checkpointed $candidate_name on the private duckai branch."
                return 0
              fi
              sleep 2
            done
            return 1
          }
          while [[ "$successful" -lt "$target" && "$attempt" -lt "$max_total_attempts" ]]; do
            attempt=$((attempt + 1))
            run_dir="duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-candidate-${attempt}"
            action_log="${RUNNER_TEMP}/duckai-private-${attempt}.log"
            new_attempt=$((attempt - prior_attempts))
            batch_attempt_limit="$((max_total_attempts - prior_attempts))"
            echo "::notice title=Candidate progress::Batch attempt ${new_attempt} of ${batch_attempt_limit} started (candidate ${attempt} overall); ${successful} of ${target} passes so far."
            set +e
            CANDIDATE_INDEX="$attempt" GITHUB_STEP_SUMMARY="" xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python -u duckai_automation/run_duckai.py > "$action_log" 2>&1
            candidate_exit=$?
            set -e
            attempt_outcome="did not pass"
            if [[ "$candidate_exit" -eq 0 ]] && python -c 'import json,sys; n=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(0 if n.get("counted_as_pass", n.get("automated_success")) is True else 1)' "$run_dir/run_notes.json" >/dev/null 2>&1; then
              attempt_outcome="passed"
              successful="$(python duckai_automation/scripts/continuation.py pass-count --candidates-dir duckai-runs)"
            fi
            if [[ ! -d "$run_dir" ]]; then mkdir -p "$run_dir/debug"; fi
            if [[ ! -f "$run_dir/run_notes.json" ]]; then
              printf '{"site_index":1,"candidate_index":%s,"automated_success":false,"status":"generation_failed"}\n' "$attempt" > "$run_dir/run_notes.json"
            fi
            echo "::notice title=Candidate progress::Batch attempt ${new_attempt} of ${batch_attempt_limit} ${attempt_outcome} (candidate ${attempt} overall); ${successful} of ${target} passes so far."
            mkdir -p "$run_dir/debug"
            cp "$action_log" "$run_dir/debug/action.log"
            if [[ "$attempt_outcome" != "passed" ]]; then
              failure_summary="$(python duckai_automation/scripts/summarize_candidate_failure.py "$run_dir")"
              echo "::notice title=Candidate failure::Candidate ${attempt} failed: ${failure_summary}. Saving full trace and screenshot evidence to the private branch now."
            fi
            if ! checkpoint_candidate "$run_dir"; then
              echo "::error title=Private evidence checkpoint failed::Stopping after ${run_dir}; the final evidence-save step will retry."
              break
            fi
            if grep -q '"failure_category": "access_gate"' "$run_dir/run_notes.json"; then
              echo "::notice title=Candidate continuation::Stopping after an access gate; this run is not eligible for continuation."
              break
            fi
          done
          printf 'successful_count=%s\nattempt_count=%s\nnew_attempt_count=%s\n' "$successful" "$attempt" "$((attempt - prior_attempts))" >> "$GITHUB_OUTPUT"
          echo "Private target processing finished: ${successful}/${target} automated passes after ${attempt} total attempt(s)."

      - name: Commit candidate evidence to the private repository
        if: always() && steps.validate_marker.outcome == 'success'
        env:
          TARGET_BRANCH: duckai
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count }}
          ATTEMPT_COUNT: ${{ steps.generate.outputs.attempt_count }}
          NEW_ATTEMPT_COUNT: ${{ steps.generate.outputs.new_attempt_count }}
        run: |
          set -euo pipefail
          private_source_root="${PRIVATE_SOURCE_ROOT:-private-source}"
          job_relative_path="private_automation/queue/jobs/${JOB_ID}.json"
          if [[ ! -f "$private_source_root/$job_relative_path" ]]; then
            for candidate_root in private-source private-source-main; do
              if [[ -f "$candidate_root/$job_relative_path" ]]; then
                private_source_root="$candidate_root"
                break
              fi
            done
          fi
          if [[ ! -f "$private_source_root/$job_relative_path" ]]; then
            echo "::warning::Private job record unavailable; no candidate evidence can be saved."
            exit 0
          fi
          export PRIVATE_SOURCE_ROOT="$private_source_root"
          result_slug="$(python - "$JOB_ID" <<'PY'
          import json, os, pathlib, re, sys
          job_path = pathlib.Path(os.environ.get("PRIVATE_SOURCE_ROOT", "private-source")) / "private_automation/queue/jobs" / f"{sys.argv[1]}.json"
          job = json.loads(job_path.read_text(encoding="utf-8"))
          slug = job.get("result_slug", "")
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("The private target has no valid result slug.")
          print(slug)
          PY
          )"
          mkdir -p "private-results/private_automation/queue/jobs"
          cp "$PRIVATE_SOURCE_ROOT/private_automation/queue/jobs/${JOB_ID}.json" "private-results/private_automation/queue/jobs/${JOB_ID}.json"
          result_dir="private-results/results/${result_slug}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir/candidates"
          shopt -s nullglob
          run_dirs=(duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-candidate-*)
          for run_dir in "${run_dirs[@]}"; do
            [[ -d "$run_dir" ]] || continue
            cp -R "$run_dir" "$result_dir/candidates/"
          done
          python duckai_automation/scripts/continuation.py status \
            --output "$result_dir/status.json" --job-id "$JOB_ID" \
            --candidates-dir "$result_dir/candidates" \
            --attempts "${ATTEMPT_COUNT:-0}" --new-attempts "${NEW_ATTEMPT_COUNT:-0}" \
            --public-workflow-run "$GITHUB_RUN_ID" \
            --continued-from "${PRIOR_JOB_ID:-}" --parent-run-id "${PRIOR_RUN_ID:-}"
          python private-results/private_automation/scripts/build_results_index.py
          cd private-results
          git config --global --add safe.directory "$GITHUB_WORKSPACE/private-results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "private_automation/queue/jobs/${JOB_ID}.json" "results/${result_slug}" results/README.md results/successful.csv
          git commit -m "private: save Duck.ai result ${JOB_ID} [skip ci]"
          for retry in 1 2 3 4 5; do
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Saved candidate evidence to the private repository."
              exit 0
            fi
            sleep 2
          done
          echo "Could not save private candidate evidence after five attempts."
          exit 1

      - name: Require three automated passes
        if: always() && steps.generate.outcome == 'success'
        env:
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count }}
        run: |
          if [[ "${SUCCESSFUL_COUNT:-0}" -lt 3 ]]; then
            echo "This private target did not reach three automated passes. Diagnostics were saved privately."
            exit 1
          fi
          echo "Three candidates passed automated checks. Human visual and factual review remains pending."
