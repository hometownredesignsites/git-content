name: Duck.ai Private Queue

on:
  push:
    branches:
      - duckai
    paths:
      - ".private-queue/start/*.json"

permissions:
  contents: read

concurrency:
  group: duckai-private-queue
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == 'duckai'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      PRIVATE_TARGET_JOB_ID: ${{ secrets.DUCKAI_TARGET_JOB_ID }}
      PRIVATE_TARGET_ROW_JSON: ${{ secrets.DUCKAI_TARGET_ROW_JSON }}
    steps:
      - name: Check out the Duck.ai pipeline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate the opaque start marker
        id: validate_marker
        env:
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! "$PRIVATE_TARGET_JOB_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "The active private job ID is missing or invalid."
            exit 1
          fi
          marker=".private-queue/start/${PRIVATE_TARGET_JOB_ID}.json"
          if ! git show "${PUSH_SHA}:${marker}" > "${RUNNER_TEMP}/start-marker.json"; then
            echo "The start marker is missing from the triggering commit."
            exit 1
          fi
          marker_job_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("job_id", ""))' "${RUNNER_TEMP}/start-marker.json")"
          if [[ "$marker_job_id" != "$PRIVATE_TARGET_JOB_ID" ]]; then
            echo "The start marker does not match the active private job."
            exit 1
          fi
          if [[ "${marker##*/}" != "${marker_job_id}.json" ]]; then
            echo "The start marker filename does not match its job ID."
            exit 1
          fi
          echo "JOB_ID=$marker_job_id" >> "$GITHUB_ENV"
          echo "SITE_INDEX=1" >> "$GITHUB_ENV"

      - name: Check out private input records
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: duckai
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-source
          fetch-depth: 1

      - name: Check out legacy private input records
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: main
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-source-main
          fetch-depth: 1

      - name: Load and mask private target fields
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, uuid
          from pathlib import Path
          from urllib.parse import urlparse
          raw = os.environ.get("PRIVATE_TARGET_ROW_JSON", "")
          row = json.loads(raw)
          if not isinstance(row, dict):
              raise SystemExit("The private target row is invalid.")
          normalized = {}
          for key, value in row.items():
              name = re.sub(r"[^A-Za-z0-9_]", "_", str(key).strip()).upper()
              if not name or name[0].isdigit():
                  name = "FIELD_" + name
              if name in normalized:
                  raise SystemExit("The private target contains colliding CSV column names.")
              value = " ".join(str(value or "").split())
              normalized[name] = value
              if value:
                  print(f"::add-mask::{value}")
          required = ("WEBSITE", "BUSINESS", "CATEGORY")
          if any(not normalized.get(key) for key in required):
              raise SystemExit("The private target row is missing a required field.")
          website = normalized["WEBSITE"]
          parsed = urlparse(website)
          if parsed.scheme not in {"http", "https"} or not parsed.hostname or any(char.isspace() for char in website):
              raise SystemExit("The private target website must use HTTP or HTTPS.")
          aliases = {
              "SOURCE_URL": normalized["WEBSITE"],
              "BUSINESS_NAME": normalized["BUSINESS"],
              "INDUSTRY_CATEGORY": normalized["CATEGORY"],
              "LOCATION": normalized.get("LOCATION", ""),
          }
          job_path = Path("private-source/private_automation/queue/jobs") / f"{os.environ.get('PRIVATE_TARGET_JOB_ID', '')}.json"
          source_root = Path("private-source")
          if not job_path.is_file():
              source_root = Path("private-source-main")
              job_path = source_root / "private_automation/queue/jobs" / f"{os.environ.get('PRIVATE_TARGET_JOB_ID', '')}.json"
          job = json.loads(job_path.read_text(encoding="utf-8"))
          if job.get("job_id") != os.environ.get("PRIVATE_TARGET_JOB_ID") or job.get("provider") != "duckai" or job.get("row") != row:
              raise SystemExit("The private Duck.ai job record does not match the active target.")
          continuation = job.get("continuation", {})
          if not isinstance(continuation, dict):
              continuation = {}
          candidate_attempt_limit = int(job.get("candidate_attempt_limit", 10) or 10)
          if not 1 <= candidate_attempt_limit <= 10:
              raise SystemExit("The private Duck.ai candidate attempt limit is outside the ten-attempt bounds.")
          prior_passes = int(continuation.get("successful_candidates", 0) or 0)
          prior_attempts = int(continuation.get("attempts", 0) or 0)
          if continuation.get("parent_job_id") and (prior_attempts != 10 or not 0 <= prior_passes < 3):
              raise SystemExit("The Duck.ai continuation record is outside the ten-attempt bounds.")
          aliases.update({
              "PRIOR_JOB_ID": str(continuation.get("parent_job_id", "")),
              "PRIOR_RUN_ID": str(continuation.get("parent_run_id", "")),
              "PRIOR_SUCCESSFUL_CANDIDATES": str(prior_passes),
              "PRIOR_ATTEMPTS": str(prior_attempts),
              "CANDIDATE_ATTEMPT_LIMIT": str(candidate_attempt_limit),
          })
          aliases.update({f"CSV_FIELD_{key}": value for key, value in normalized.items()})
          aliases["PRIVATE_SOURCE_ROOT"] = str(source_root)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for name, value in aliases.items():
                  delimiter = "GIT_CONTENT_" + uuid.uuid4().hex
                  while delimiter in value:
                      delimiter = "GIT_CONTENT_" + uuid.uuid4().hex
                  handle.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          PY
          echo "::add-mask::$PRIVATE_TARGET_JOB_ID"
          echo "Loaded the private row for the requested run."

      - name: Install Playwright dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-playwright.txt

      - name: Validate Duck.ai retry policy
        run: python -m unittest discover -s duckai_automation/tests -v

      - name: Check out Duck.ai results branch
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: duckai
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-results
          fetch-depth: 0

      - name: Generate candidate sites
        id: generate
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          successful=0
          prior_attempts="${PRIOR_ATTEMPTS:-0}"
          attempt="$prior_attempts"
          new_attempts=0
          target=3
          max_attempts="${CANDIDATE_ATTEMPT_LIMIT:-10}"
          candidate_dirs=()
          mapfile -t candidate_indices < <(python duckai_automation/scripts/continuation.py indices --prior-attempts "$prior_attempts" --max-attempts "$max_attempts")
          if [[ -n "${PRIOR_JOB_ID:-}" ]]; then
            python duckai_automation/scripts/continuation.py inherit \
              --results-root private-results/results \
              --destination-root duckai-runs \
              --parent-job-id "$PRIOR_JOB_ID" --parent-run-id "${PRIOR_RUN_ID:-0}" \
              --expected-passes "${PRIOR_SUCCESSFUL_CANDIDATES:-0}" \
              --current-run-id "$GITHUB_RUN_ID" --current-run-attempt "$GITHUB_RUN_ATTEMPT"
            successful="${PRIOR_SUCCESSFUL_CANDIDATES:-0}"
            mapfile -t inherited_dirs < <(find "duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-candidate-inherited"* -maxdepth 0 -type d 2>/dev/null | sort)
            candidate_dirs+=("${inherited_dirs[@]}")
          fi
          while [[ "$successful" -lt "$target" && "$new_attempts" -lt "$max_attempts" ]]; do
            attempt="${candidate_indices[$new_attempts]}"
            new_attempts=$((new_attempts + 1))
            run_dir="duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-candidate-${attempt}"
            candidate_dirs+=("$run_dir")
            action_log="${RUNNER_TEMP}/duckai-private-${attempt}.log"
            echo "::notice title=Candidate progress::Batch attempt ${new_attempts} of ${max_attempts} started (candidate ${attempt} overall); ${successful} of ${target} passes so far."
            set +e
            CANDIDATE_INDEX="$attempt" GITHUB_STEP_SUMMARY="" xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python -u duckai_automation/run_duckai.py > "$action_log" 2>&1
            candidate_exit=$?
            set -e
            attempt_outcome="did not pass"
            if [[ "$candidate_exit" -eq 0 ]] && python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1], encoding="utf-8")).get("automated_success") else 1)' "$run_dir/run_notes.json" >/dev/null 2>&1; then
              successful=$((successful + 1))
              attempt_outcome="passed"
            fi
            if [[ ! -d "$run_dir" ]]; then mkdir -p "$run_dir/debug"; fi
            if [[ ! -f "$run_dir/run_notes.json" ]]; then
              printf '{"site_index":1,"candidate_index":%s,"automated_success":false,"status":"generation_failed"}\n' "$attempt" > "$run_dir/run_notes.json"
            fi
            echo "::notice title=Candidate progress::Batch attempt ${new_attempts} of ${max_attempts} ${attempt_outcome} (candidate ${attempt} overall); ${successful} of ${target} passes so far."
            mkdir -p "$run_dir/debug"
            cp "$action_log" "$run_dir/debug/action.log"
          done
          python - "$GITHUB_OUTPUT" "$successful" "$attempt" "${candidate_dirs[@]}" <<'PY'
          import json, os, pathlib, sys
          output = pathlib.Path(sys.argv[1])
          dirs = sys.argv[4:]
          summary = pathlib.Path(f"duckai-runs/run-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-site-1-batch-summary.json")
          summary.write_text(json.dumps({"site_index": 1, "target_passing_candidates": 3, "successful_candidates": int(sys.argv[2]), "attempts": int(sys.argv[3]), "new_attempts": int(sys.argv[3]) - int(os.environ.get("PRIOR_ATTEMPTS", "0")), "candidate_folders": dirs, "automated_success": int(sys.argv[2]) >= 3}, indent=2) + "\n", encoding="utf-8")
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"successful_count={sys.argv[2]}\nattempt_count={sys.argv[3]}\nnew_attempt_count={int(sys.argv[3]) - int(os.environ.get('PRIOR_ATTEMPTS', '0'))}\n")
          PY
          echo "Private target processing finished: ${successful}/${target} automated passes after ${attempt} attempt(s)."
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '## Private Duck.ai candidate batch\n\n- Automated passes: **%s/%s**\n- Attempts: **%s** total, **%s** in this run\n- Candidate files are stored in the private repository.\n' "$successful" "$target" "$attempt" "$new_attempts" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit candidate evidence to the private repository
        if: always() && steps.validate_marker.outcome == 'success'
        env:
          TARGET_BRANCH: duckai
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count }}
          ATTEMPT_COUNT: ${{ steps.generate.outputs.attempt_count }}
          NEW_ATTEMPT_COUNT: ${{ steps.generate.outputs.new_attempt_count }}
          PRIOR_JOB_ID: ${{ env.PRIOR_JOB_ID }}
          PRIOR_RUN_ID: ${{ env.PRIOR_RUN_ID }}
          PRIOR_ATTEMPTS: ${{ env.PRIOR_ATTEMPTS }}
          PRIVATE_SOURCE_ROOT: ${{ env.PRIVATE_SOURCE_ROOT }}
        run: |
          set -euo pipefail
          result_slug="$(python - "$JOB_ID" <<'PY'
          import json, os, pathlib, re, sys
          job_path = pathlib.Path(os.environ.get("PRIVATE_SOURCE_ROOT", "private-source")) / "private_automation/queue/jobs" / f"{sys.argv[1]}.json"
          job = json.loads(job_path.read_text(encoding="utf-8"))
          slug = job.get("result_slug", "")
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("The private target has no valid result slug.")
          print(slug)
          PY
          )"
          mkdir -p "private-results/private_automation/queue/jobs"
          cp "$PRIVATE_SOURCE_ROOT/private_automation/queue/jobs/${JOB_ID}.json" "private-results/private_automation/queue/jobs/${JOB_ID}.json"
          result_dir="private-results/results/${result_slug}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir/candidates"
          shopt -s nullglob
          run_dirs=(duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-candidate-*)
          for run_dir in "${run_dirs[@]}"; do
            [[ -d "$run_dir" ]] || continue
            cp -R "$run_dir" "$result_dir/candidates/"
          done
          status="failed"
          if [[ "${SUCCESSFUL_COUNT:-0}" -ge 3 ]]; then status="passed"; fi
          if [[ -f "duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-batch-summary.json" ]]; then
            cp "duckai-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-batch-summary.json" "$result_dir/batch-summary.json"
          fi
          python duckai_automation/scripts/continuation.py status \
            --output "$result_dir/status.json" --candidates-dir "$result_dir/candidates" \
            --job-id "$JOB_ID" --successful "${SUCCESSFUL_COUNT:-0}" \
            --attempts "${ATTEMPT_COUNT:-0}" --new-attempts "${NEW_ATTEMPT_COUNT:-0}" \
            --public-workflow-run "$GITHUB_RUN_ID" \
            --continued-from "$PRIOR_JOB_ID" --parent-run-id "$PRIOR_RUN_ID" \
            --derive-candidate-counts --prior-attempts "${PRIOR_ATTEMPTS:-0}"
          python private-results/private_automation/scripts/build_results_index.py
          cd private-results
          git config --global --add safe.directory "$GITHUB_WORKSPACE/private-results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "private_automation/queue/jobs/${JOB_ID}.json" "results/${result_slug}" results/README.md results/successful.csv
          git commit -m "private: save Duck.ai result ${JOB_ID} [skip ci]"
          for retry in 1 2 3 4 5; do
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Saved candidate evidence to the private repository."
              exit 0
            fi
            sleep 2
          done
          echo "Could not save private candidate evidence after five attempts."
          exit 1

      - name: Require three automated passes
        if: always() && steps.generate.outcome == 'success'
        env:
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count }}
        run: |
          if [[ "${SUCCESSFUL_COUNT:-0}" -lt 3 ]]; then
            echo "This private target did not reach three automated passes. Diagnostics were saved privately."
            exit 1
          fi
          echo "Three candidates passed automated checks. Human visual and factual review remains pending."
