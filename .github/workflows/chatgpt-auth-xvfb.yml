name: ChatGPT Authentication Smoke Test (Xvfb)

on:
  push:
    branches: [auth-chatgpt-baseline]
    paths:
      - ".github/workflows/chatgpt-auth-xvfb.yml"
      - "auth_smoke/**"
  # GitHub's Run workflow button requires this file to exist on the default
  # branch; push on auth-chatgpt-baseline is the working trigger while this stays here.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-auth-xvfb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticate:
    if: github.ref == 'refs/heads/auth-chatgpt-baseline'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    environment:
      name: chatgpt-auth
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test email-only auth helpers
        run: python -m unittest discover -s auth_smoke -v

      - name: Install pinned Playwright browser
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.58.0"
          python -m playwright install chromium

      - name: Authenticate in headed Chromium under Xvfb (email-only)
        env:
          CHATGPT_LOGIN_EMAIL: ${{ secrets.CHATGPT_LOGIN_EMAIL }}
          CHATGPT_TOTP_SECRET: ${{ secrets.CHATGPT_TOTP_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p auth-smoke-results
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            python -u auth_smoke/chatgpt_auth_smoke.py \
              --result-file auth-smoke-results/result.json

      - name: Upload authentication result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-auth-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: auth-smoke-results/
          if-no-files-found: warn
          retention-days: 7
