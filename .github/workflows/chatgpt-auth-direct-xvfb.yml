name: ChatGPT Authentication Smoke Test (Direct Playwright + Xvfb)

on:
  push:
    branches: [auth-chatgpt-baseline]
    paths:
      - ".github/workflows/chatgpt-auth-direct-xvfb.yml"
      - "auth_smoke/chatgpt_auth_smoke.py"
      - "auth_smoke/chatgpt_auth_smoke_direct.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-auth-direct-xvfb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authenticate:
    if: github.ref == 'refs/heads/auth-chatgpt-baseline'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    environment:
      name: chatgpt-auth
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test TOTP and sign-in selector helpers
        run: python -m unittest discover -s auth_smoke -v

      - name: Install pinned Playwright browser
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.58.0"
          python -m playwright install chromium

      - name: Authenticate with direct headed Playwright launch under Xvfb
        env:
          CHATGPT_LOGIN_EMAIL: ${{ secrets.CHATGPT_LOGIN_EMAIL }}
          CHATGPT_LOGIN_PASSWORD: ${{ secrets.CHATGPT_LOGIN_PASSWORD }}
          CHATGPT_TOTP_SECRET: ${{ secrets.CHATGPT_TOTP_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p auth-smoke-direct-results
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python -u auth_smoke/chatgpt_auth_smoke_direct.py --result-file auth-smoke-direct-results/result.json

      - name: Upload direct Playwright authentication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-auth-direct-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: auth-smoke-direct-results/
          if-no-files-found: warn
          retention-days: 7
