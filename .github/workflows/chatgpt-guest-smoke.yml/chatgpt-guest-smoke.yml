name: ChatGPT Guest Session Smoke Test (Xvfb)

on:
  push:
    branches: [auth-chatgpt-baseline]
    paths:
      - ".github/workflows/chatgpt-guest-smoke.yml"
      - "chatgpt_file_playwright_anonymous_ci.py"
      - "playwright_runner/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-guest-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guest-smoke:
    if: github.ref == 'refs/heads/auth-chatgpt-baseline'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-playwright.txt

      - name: Send one message in a fresh guest session
        run: |
          set -euo pipefail
          mkdir -p tmp/guest-smoke tmp/playwright-profiles/guest-smoke
          cat > tmp/guest-smoke/prompt.txt <<'EOF'
          For this guest-session smoke check, reply with exactly GUEST-SMOKE-OK and no other text.
          EOF
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python -u chatgpt_file_playwright_anonymous_ci.py --stage-name guest_smoke --input-file tmp/guest-smoke/prompt.txt --output-file tmp/guest-smoke/runner_output.txt --metadata-output-file tmp/guest-smoke/runner_metadata.json --url https://chatgpt.com/ --user-data-dir tmp/playwright-profiles/guest-smoke --start-new-chat --wait-seconds 45 --timeout-ms 180000 --post-response-wait-seconds 3 --response-settle-seconds 3 --max-settle-wait-seconds 180 --error-screenshot tmp/guest-smoke/chatgpt_error.png

      - name: Verify and report the guest response
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_path = Path("tmp/guest-smoke/runner_output.txt")
          metadata_path = Path("tmp/guest-smoke/runner_metadata.json")
          output = output_path.read_text(encoding="utf-8").strip()
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if output != "GUEST-SMOKE-OK":
              raise SystemExit(f"Guest response did not match the expected marker. Captured {len(output)} characters.")
          if not metadata.get("final_url", "").startswith("https://chatgpt.com/"):
              raise SystemExit("No ChatGPT page URL was captured after the guest response.")
          print("PASS: the fresh guest session sent one message and received GUEST-SMOKE-OK.")
          print("Conversation URL: " + metadata["final_url"])
          print("Response: " + output)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## ChatGPT guest-session smoke test\n\n")
              summary.write("- Status: passed\n- Response: GUEST-SMOKE-OK\n")
              summary.write("- Conversation: " + metadata["final_url"] + "\n")
          PY

      - name: Upload guest-session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-guest-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/guest-smoke/
          if-no-files-found: warn
          retention-days: 14
