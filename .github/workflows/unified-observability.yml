name: Unified Operations Dashboard
run-name: Unified Operations Dashboard (${{ github.event_name }})

on:
  workflow_dispatch:
  schedule:
    - cron: "47 10 * * *"

permissions:
  contents: read

concurrency:
  group: unified-operations-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public workflow repository
        uses: actions/checkout@v4

      - name: Check out private reporting repository
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: chatgpt
          path: content-data
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          persist-credentials: true

      - name: Check out lead-operations snapshot
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/website-lead-hunting-operations
          ref: git-chatgpt
          path: lead-operations
          token: ${{ secrets.LEAD_OPERATIONS_TOKEN }}
          persist-credentials: false

      - name: Validate and stage lead snapshot
        run: |
          set -euo pipefail
          snapshot="lead-operations/observability/chatgpt/snapshot.json"
          test -s "$snapshot" || { echo "::error::Lead-hunting snapshot is missing: $snapshot"; exit 1; }
          python -m json.tool "$snapshot" > /dev/null
          mkdir -p content-data/tmp
          cp "$snapshot" content-data/tmp/lead_snapshot.json
          echo "Lead-hunting snapshot fetched and validated."

      - name: Build unified dashboard
        working-directory: content-data
        run: python3 private_automation/build_unified_dashboard.py

      - name: Commit generated dashboard to private repository
        working-directory: content-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin chatgpt
          git add observability/chatgpt/index.html observability/chatgpt/unified_snapshot.json
          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git commit -m "Refresh unified operations dashboard"
          git push origin HEAD:chatgpt
name: Unified Operations Dashboard
run-name: Unified Operations Dashboard (${{ github.event_name }})

on:
  workflow_dispatch:
  schedule:
    - cron: "47 */2 * * *"

permissions:
  contents: read

concurrency:
  group: unified-operations-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public workflow repository
        uses: actions/checkout@v4

      - name: Check out private reporting repository
        uses: actions/checkout@v4
        with:
          repository: hometownredesignsites/git-content-private
          ref: chatgpt
          path: content-data
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          persist-credentials: true

      - name: Fetch public lead-hunting snapshot
        working-directory: content-data
        timeout-minutes: 20
        run: |
          mkdir -p tmp
          snapshot_url="https://raw.githubusercontent.com/hometownredesignsites/website-lead-hunting-operations/git-chatgpt/observability/chatgpt/snapshot.json"
          max_attempts=24
          for attempt in $(seq 1 "$max_attempts"); do
            if curl --fail --silent --show-error --location "$snapshot_url" -o tmp/lead_snapshot.json \
              && python -m json.tool tmp/lead_snapshot.json > /dev/null; then
              echo "Lead-hunting snapshot fetched and validated on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Snapshot not available or invalid yet (attempt $attempt/$max_attempts); retrying in 30 seconds."
              sleep 30
            fi
          done
          echo "::error::Lead-hunting snapshot was unavailable or invalid after $max_attempts attempts."
          exit 1

      - name: Build unified dashboard
        working-directory: content-data
        run: python3 private_automation/build_unified_dashboard.py

      - name: Commit generated dashboard to private repository
        working-directory: content-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin chatgpt
          git add observability/chatgpt/index.html observability/chatgpt/unified_snapshot.json
          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi
          git commit -m "Refresh unified operations dashboard"
          git push origin HEAD:chatgpt
