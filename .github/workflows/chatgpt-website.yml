name: ChatGPT Website Redesign

on:
  push:
    branches:
      - chatgpt
    paths:
      - "chatgpt_automation/source_urls.csv"
      - ".github/workflows/chatgpt-website.yml"

permissions:
  contents: write

concurrency:
  group: chatgpt-website-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-playwright.txt

      - name: Generate, assemble, and check one website
        run: xvfb-run -a python -u chatgpt_automation/run_website.py

      - name: Save candidate, transcript, and QA evidence
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE:-$(pwd)}"
          git config --global --add safe.directory "$(pwd)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "chatgpt-runs/website-run-${RUN_ID}-${RUN_ATTEMPT}/"
          if git diff --cached --quiet; then
            echo "No candidate artifacts were created."
            exit 0
          fi
          git commit -m "chatgpt: save website run ${RUN_ID}-${RUN_ATTEMPT} [skip ci]"
          if git push origin "HEAD:${BRANCH_NAME}"; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if git pull --rebase origin "$BRANCH_NAME" && git push origin "HEAD:${BRANCH_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 2
          done
          echo "Failed to push candidate artifacts after retries."
          exit 1
