name: ChatGPT Private Queue

on:
  push:
    branches: [chatgpt]
    paths:
      - ".private-queue/start/*.json"
  workflow_dispatch:
    inputs:
      job_id:
        description: Private ChatGPT job ID to run or continue
        required: true
        type: string
  workflow_call:
    inputs:
      job_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: chatgpt-private-queue
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == 'chatgpt'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --user root --shm-size=1gb
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      PRIVATE_TARGET_JOB_ID: ${{ inputs.job_id || secrets.CHATGPT_TARGET_JOB_ID }}
      INPUT_JOB_ID: ${{ inputs.job_id }}
      PRIVATE_TARGET_ROW_JSON: ${{ secrets.CHATGPT_TARGET_ROW_JSON }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the ChatGPT pipeline
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate the opaque start marker
        id: validate_marker
        env:
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ -n "${INPUT_JOB_ID:-}" ]]; then
            job_id="$INPUT_JOB_ID"
            if [[ ! "$job_id" =~ ^[0-9a-f-]{36}$ ]]; then echo "The private job ID is invalid."; exit 1; fi
            echo "::add-mask::$job_id"
            echo "JOB_ID=$job_id" >> "$GITHUB_ENV"
            echo "SITE_INDEX=1" >> "$GITHUB_ENV"
            echo "Validated the private job ID for the scheduled call."
            exit 0
          fi
          if [[ ! "$PRIVATE_TARGET_JOB_ID" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "The active private job ID is missing or invalid."
            exit 1
          fi
          marker=".private-queue/start/${PRIVATE_TARGET_JOB_ID}.json"
          if ! git show "${PUSH_SHA}:${marker}" > "${RUNNER_TEMP}/start-marker.json"; then
            echo "The start marker is missing from the triggering commit."
            exit 1
          fi
          marker_job_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("job_id", ""))' "${RUNNER_TEMP}/start-marker.json")"
          if [[ "$marker_job_id" != "$PRIVATE_TARGET_JOB_ID" || "${marker##*/}" != "${marker_job_id}.json" ]]; then
            echo "The start marker does not match the active private job."
            exit 1
          fi
          echo "::add-mask::$PRIVATE_TARGET_JOB_ID"
          echo "JOB_ID=$marker_job_id" >> "$GITHUB_ENV"
          echo "SITE_INDEX=1" >> "$GITHUB_ENV"
          echo "Validated the opaque private start marker."

      - name: Check out private input records
        id: private_source
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v5
        with:
          repository: hometownredesignsites/git-content-private
          ref: chatgpt
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-source
          fetch-depth: 1

      - name: Check out legacy private input records
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v5
        with:
          repository: hometownredesignsites/git-content-private
          ref: main
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-source-main
          fetch-depth: 1

      - name: Check out private ChatGPT results
        id: private_results
        if: steps.validate_marker.outcome == 'success'
        uses: actions/checkout@v5
        with:
          repository: hometownredesignsites/git-content-private
          ref: chatgpt
          token: ${{ secrets.PRIVATE_RESULTS_TOKEN }}
          path: private-results
          fetch-depth: 0

      - name: Validate and mask private target fields
        id: private_target
        if: steps.private_source.outcome == 'success'
        env:
          JOB_ID: ${{ inputs.job_id || secrets.CHATGPT_TARGET_JOB_ID }}
          INPUT_JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, uuid
          from pathlib import Path
          from urllib.parse import urlparse

          job_id = os.environ.get("JOB_ID", "")
          job_path = Path("private-source/private_automation/queue/jobs") / f"{job_id}.json"
          source_root = Path("private-source")
          if not job_path.is_file():
              source_root = Path("private-source-main")
              job_path = source_root / "private_automation/queue/jobs" / f"{job_id}.json"
          job = json.loads(job_path.read_text(encoding="utf-8"))
          if job.get("job_id") != job_id or job.get("provider") != "chatgpt":
              raise SystemExit("The private job record is invalid for this provider.")
          candidate_attempt_limit = job.get("candidate_attempt_limit", 10)
          if isinstance(candidate_attempt_limit, bool) or not isinstance(candidate_attempt_limit, int) or not 1 <= candidate_attempt_limit <= 10:
              raise SystemExit("The private candidate attempt limit must be an integer from 1 to 10.")
          expected = job.get("row")
          if os.environ.get("INPUT_JOB_ID"):
              row = expected
          else:
              row = json.loads(os.environ.get("PRIVATE_TARGET_ROW_JSON", ""))
              if not isinstance(row, dict) or row != expected:
                  raise SystemExit("The active private target does not match its private job record.")
          normalized = {}
          for key, value in row.items():
              name = re.sub(r"[^A-Za-z0-9_]", "_", str(key).strip()).upper()
              if not name or name[0].isdigit():
                  name = "FIELD_" + name
              if name in normalized:
                  raise SystemExit("The private target contains colliding CSV column names.")
              value = " ".join(str(value or "").split())
              normalized[name] = value
              if value:
                  print(f"::add-mask::{value}")
          if any(not normalized.get(key) for key in ("WEBSITE", "BUSINESS", "CATEGORY")):
              raise SystemExit("The private target row is missing a required field.")
          website = normalized["WEBSITE"]
          parsed = urlparse(website)
          if parsed.scheme not in {"http", "https"} or not parsed.hostname or any(char.isspace() for char in website):
              raise SystemExit("The private target website must use HTTP or HTTPS.")
          aliases = {
              "SOURCE_URL": website,
              "BUSINESS_NAME": normalized["BUSINESS"],
              "INDUSTRY_CATEGORY": normalized["CATEGORY"],
              "LOCATION": normalized.get("LOCATION", ""),
              "CANDIDATE_ATTEMPT_LIMIT": str(candidate_attempt_limit),
          }
          aliases.update({f"CSV_FIELD_{key}": value for key, value in normalized.items()})
          aliases["PRIVATE_SOURCE_ROOT"] = str(source_root)
          continuation = job.get("continuation", {})
          if not isinstance(continuation, dict):
              continuation = {}
          prior_passes = int(continuation.get("successful_candidates", 0) or 0)
          prior_attempts = int(continuation.get("attempts", 0) or 0)
          if continuation.get("parent_job_id") and (prior_attempts != 10 or not 0 <= prior_passes < 3):
              raise SystemExit("The ChatGPT continuation record is outside the ten-attempt bounds.")
          aliases.update({
              "PRIOR_JOB_ID": str(continuation.get("parent_job_id", "")),
              "PRIOR_RUN_ID": str(continuation.get("parent_run_id", "")),
              "PRIOR_SUCCESSFUL_CANDIDATES": str(prior_passes),
              "PRIOR_ATTEMPTS": str(prior_attempts),
          })
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for name, value in aliases.items():
                  delimiter = "GIT_CONTENT_" + uuid.uuid4().hex
                  while delimiter in value:
                      delimiter = "GIT_CONTENT_" + uuid.uuid4().hex
                  handle.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")
          print("Loaded and masked the private target row.")
          PY

      - name: Validate saved-response assembly and structural gate fixtures
        if: steps.private_target.outcome == 'success'
        run: python -m unittest discover -s chatgpt_automation/tests -v

      - name: Install pinned Playwright dependencies
        if: steps.private_target.outcome == 'success'
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/workflows/requirements-playwright.txt

      - name: Fetch source facts privately
        id: context
        if: steps.private_target.outcome == 'success'
        run: |
          set -euo pipefail
          SOURCE_FACTS="tmp/chatgpt-source-facts/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1.json"
          mkdir -p "$(dirname "$SOURCE_FACTS")" "${RUNNER_TEMP}/chatgpt-private"
          if python chatgpt_automation/scripts/fetch_source_facts.py \
            --source-url "$SOURCE_URL" \
            --business "$BUSINESS_NAME" \
            --category "$INDUSTRY_CATEGORY" \
            --location "$LOCATION" \
            --output "$SOURCE_FACTS" > "${RUNNER_TEMP}/chatgpt-private/source-fetch.log" 2>&1; then
            echo "source_facts=$SOURCE_FACTS" >> "$GITHUB_OUTPUT"
            echo "Source facts collected; details are stored with private run evidence."
          else
            echo "Source fact collection failed; diagnostic details will be saved privately."
            diagnostic_dir="chatgpt-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-diagnostics/debug"
            mkdir -p "$diagnostic_dir"
            cp "${RUNNER_TEMP}/chatgpt-private/source-fetch.log" "$diagnostic_dir/source-fetch.log"
            printf '{"status":"source_facts_failed","automated_success":false,"final_success":false}\n' > "${diagnostic_dir%/debug}/run_notes.json"
            exit 1
          fi

      - name: Generate complete candidates until three pass
        id: generate
        if: steps.context.outcome == 'success'
        env:
          SOURCE_FACTS: ${{ steps.context.outputs.source_facts }}
        run: |
          set -uo pipefail
          mkdir -p tmp/playwright-profiles "${RUNNER_TEMP}/chatgpt-private"
          successful=0
          prior_attempts="${PRIOR_ATTEMPTS:-0}"
          attempt="$prior_attempts"
          new_attempts=0
          target=3
          batch_limit="${CANDIDATE_ATTEMPT_LIMIT:-10}"
          max_total_attempts=$((batch_limit * 2))
          candidate_dirs=()
          previous_candidate_dir=""
          prior_job_id="${PRIOR_JOB_ID:-}"
          if [[ -n "$prior_job_id" ]]; then
            python chatgpt_automation/scripts/continuation.py inherit \
              --results-root private-results/results \
              --destination-root chatgpt-runs \
              --parent-job-id "$prior_job_id" --parent-run-id "${PRIOR_RUN_ID:-0}" \
              --expected-passes "${PRIOR_SUCCESSFUL_CANDIDATES:-0}" \
              --current-run-id "$GITHUB_RUN_ID" --current-run-attempt "$GITHUB_RUN_ATTEMPT"
            successful="${PRIOR_SUCCESSFUL_CANDIDATES:-0}"
            mapfile -t inherited_dirs < <(find "chatgpt-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-candidate-inherited"* -maxdepth 0 -type d 2>/dev/null | sort)
            candidate_dirs+=("${inherited_dirs[@]}")
          fi
          while [[ "$successful" -lt "$target" && "$attempt" -lt "$max_total_attempts" ]]; do
            batch_attempt_limit="$batch_limit"
            remaining_attempts=$((max_total_attempts - attempt))
            if [[ "$batch_attempt_limit" -gt "$remaining_attempts" ]]; then batch_attempt_limit="$remaining_attempts"; fi
            mapfile -t candidate_indices < <(python chatgpt_automation/scripts/continuation.py indices --prior-attempts "$attempt" --max-attempts "$batch_attempt_limit")
            batch_attempt=0
            while [[ "$successful" -lt "$target" && "$batch_attempt" -lt "$batch_attempt_limit" ]]; do
              candidate_index="${candidate_indices[$batch_attempt]}"
              attempt="$candidate_index"
              batch_attempt=$((batch_attempt + 1))
              new_attempts=$((new_attempts + 1))
              run_dir="chatgpt-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-candidate-${candidate_index}"
              candidate_dirs+=("$run_dir")
              mkdir -p "$run_dir/debug"
              echo "::notice title=Candidate progress::Batch attempt ${batch_attempt} of ${batch_attempt_limit} started (candidate ${attempt} overall); ${successful} of ${target} passes so far."
              retry_flags=()
              if [[ -n "$previous_candidate_dir" ]]; then retry_flags=(--previous-candidate "$previous_candidate_dir"); fi
              if ! python chatgpt_automation/scripts/prepare_candidate_context.py \
                --mode source \
                --source-facts "$SOURCE_FACTS" \
                --design-brief chatgpt_automation/design_brief.txt \
                --output "$run_dir/debug/website_context.md" \
                --inputs-output "$run_dir/debug/inputs.json" \
                --site-index 1 \
                --candidate-index "$candidate_index" \
                "${retry_flags[@]}" > "${RUNNER_TEMP}/chatgpt-private/context-${candidate_index}.log" 2>&1; then
                printf '{"status":"generation_failed","automated_success":false,"final_success":false,"human_visual_review_status":"pending"}\n' > "$run_dir/run_notes.json"
                previous_candidate_dir="$run_dir"
                continue
              fi
              if [[ "$candidate_index" -eq $((prior_attempts + 1)) ]]; then
                python - "$run_dir/debug/inputs.json" <<'PY'
          import json, sys
          from pathlib import Path
          inputs = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if inputs.get("source_capture_quality") == "sparse":
              print("::warning title=Sparse source evidence::No verified facts, service sections, or original photos were captured. Generation will continue, but concepts may be generic.")
          PY
              fi
              cp "$SOURCE_FACTS" "$run_dir/debug/source_facts.json"
              cp chatgpt_automation/website_request.txt "$run_dir/debug/website_request.txt"
              chat_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["chat_id"])' "$run_dir/debug/inputs.json")"
              profile="tmp/playwright-profiles/${GITHUB_RUN_ID}/1/candidate-${candidate_index}"
              action_log="${RUNNER_TEMP}/chatgpt-private/action-${candidate_index}.log"
              set +e
              xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
                python -u chatgpt_file_playwright_anonymous_ci.py \
                  --stage-name website \
                  --input-file "$run_dir/debug/website_context.md" \
                  --instructions-file chatgpt_automation/website_request.txt \
                  --output-file "$run_dir/debug/runner_output.txt" \
                  --metadata-output-file "$run_dir/debug/runner_metadata.json" \
                  --website-run-folder "$run_dir" \
                  --website-chat-id "$chat_id" \
                  --website-design-reference-file "${RUNNER_TEMP}/chatgpt-private/site-1-design-reference.json" \
                  --website-quality-request "Include only sections supported by the source pages. Preserve the source contact form's purpose and fields when present. Use relevant imagery. The hero must use a full-bleed image spanning the full viewport width, not a half-width split column. Place the headline and calls to action over the image with a contrast treatment that keeps text readable, and use a deliberate crop. Keep this full-width image treatment on mobile." \
                  --url "https://chatgpt.com/" \
                  --user-data-dir "$profile" \
                  --wait-seconds 60 \
                  --timeout-ms 180000 \
                  --post-response-wait-seconds 3 \
                  --response-settle-seconds 3 \
                  --max-settle-wait-seconds 180 \
                  --error-screenshot "$run_dir/debug/chatgpt_playwright_error.png" \
                  --website-context-mode source \
                  --start-new-chat \
                  > "$action_log" 2>&1
              runner_status=$?
              set -e
              cp "$action_log" "$run_dir/debug/action.log" 2>/dev/null || true
              if [[ "$runner_status" -eq 0 ]] && python -c 'import json,sys; raise SystemExit(0 if json.load(open(sys.argv[1], encoding="utf-8")).get("automated_success") else 1)' "$run_dir/run_notes.json" >/dev/null 2>&1; then
                successful=$((successful + 1))
                previous_candidate_dir=""
                outcome="passed"
              else
                if [[ ! -f "$run_dir/run_notes.json" ]]; then
                  printf '{"status":"generation_failed","automated_success":false,"final_success":false,"human_visual_review_status":"pending"}\n' > "$run_dir/run_notes.json"
                fi
                previous_candidate_dir="$run_dir"
                outcome="did not pass"
              fi
              echo "::notice title=Candidate progress::Batch attempt ${batch_attempt} of ${batch_attempt_limit} ${outcome} (candidate ${attempt} overall); ${successful} of ${target} passes so far."
            done
            if [[ "$successful" -ge "$target" || "$attempt" -ge "$max_total_attempts" ]]; then break; fi
            if ! python - "$successful" "$attempt" <<'PY'
          import sys
          from pathlib import Path
          from chatgpt_automation.scripts.continuation import continuation_is_eligible
          raise SystemExit(0 if continuation_is_eligible(int(sys.argv[1]), int(sys.argv[2]), Path("chatgpt-runs")) else 1)
          PY
            then
              break
            fi
            echo "::notice title=Candidate continuation::Continuing with the existing passing candidates after ${attempt} attempts."
          done
          python - "$GITHUB_OUTPUT" "$successful" "$attempt" "${candidate_dirs[@]}" <<'PY'
          import json, pathlib, sys
          output = pathlib.Path(sys.argv[1])
          dirs = sys.argv[4:]
          summary_path = f"chatgpt-runs/run-{__import__('os').environ['GITHUB_RUN_ID']}-{__import__('os').environ['GITHUB_RUN_ATTEMPT']}-site-1-batch-summary.json"
          pathlib.Path(summary_path).write_text(json.dumps({
              "site_index": 1,
              "target_passing_candidates": 3,
              "successful_candidates": int(sys.argv[2]),
              "attempts": int(sys.argv[3]),
              "new_attempts": int(sys.argv[3]) - int(__import__('os').environ.get('PRIOR_ATTEMPTS', '0')),
              "candidate_folders": dirs,
              "automated_success": int(sys.argv[2]) >= 3,
          }, indent=2) + "\n", encoding="utf-8")
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"successful_count={sys.argv[2]}\nattempt_count={sys.argv[3]}\nnew_attempt_count={int(sys.argv[3]) - int(__import__('os').environ.get('PRIOR_ATTEMPTS', '0'))}\n")
          PY
          echo "Generation finished: ${successful}/${target} automated passes after ${attempt} attempt(s)."
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '## Private ChatGPT candidate batch\n\n- Automated passes: **%s/%s**\n- Attempts: **%s** total, **%s** in this run\n- Candidate files are intended for private storage; check the save step below for confirmation.\n' "$successful" "$target" "$attempt" "$new_attempts" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save all candidate evidence to the private repository
        id: save_evidence
        if: always() && steps.validate_marker.outcome == 'success' && steps.private_source.outcome == 'success' && steps.private_results.outcome == 'success'
        env:
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count || '0' }}
          ATTEMPT_COUNT: ${{ steps.generate.outputs.attempt_count || '0' }}
          NEW_ATTEMPT_COUNT: ${{ steps.generate.outputs.new_attempt_count || '0' }}
          PRIOR_JOB_ID: ${{ env.PRIOR_JOB_ID }}
          PRIOR_RUN_ID: ${{ env.PRIOR_RUN_ID }}
          TARGET_BRANCH: chatgpt
          PRIVATE_SOURCE_ROOT: ${{ env.PRIVATE_SOURCE_ROOT }}
        run: |
          set -euo pipefail
          result_slug="$(python - "$JOB_ID" <<'PY'
          import json, os, pathlib, re, sys
          path = pathlib.Path(os.environ.get("PRIVATE_SOURCE_ROOT", "private-source")) / "private_automation/queue/jobs" / f"{sys.argv[1]}.json"
          job = json.loads(path.read_text(encoding="utf-8"))
          slug = job.get("result_slug", "")
          if job.get("provider") != "chatgpt" or not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("The private ChatGPT job record has no valid result slug.")
          print(slug)
          PY
          )"
          mkdir -p "private-results/private_automation/queue/jobs"
          cp "$PRIVATE_SOURCE_ROOT/private_automation/queue/jobs/${JOB_ID}.json" "private-results/private_automation/queue/jobs/${JOB_ID}.json"
          result_dir="private-results/results/${result_slug}/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$result_dir/candidates"
          shopt -s nullglob
          run_dirs=(chatgpt-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-*)
          for run_dir in "${run_dirs[@]}"; do
            [[ -d "$run_dir" ]] && cp -R "$run_dir" "$result_dir/candidates/"
          done
          if [[ -f "chatgpt-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-batch-summary.json" ]]; then
            cp "chatgpt-runs/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-site-1-batch-summary.json" "$result_dir/batch-summary.json"
          fi
          status="failed"
          if [[ "${SUCCESSFUL_COUNT:-0}" -ge 3 ]]; then status="passed"; fi
          python chatgpt_automation/scripts/continuation.py status \
            --output "$result_dir/status.json" --candidates-dir "$result_dir/candidates" \
            --job-id "$JOB_ID" --successful "${SUCCESSFUL_COUNT:-0}" \
            --attempts "${ATTEMPT_COUNT:-0}" --new-attempts "${NEW_ATTEMPT_COUNT:-0}" \
            --public-workflow-run "$GITHUB_RUN_ID" \
            --continued-from "$PRIOR_JOB_ID" --parent-run-id "$PRIOR_RUN_ID" \
            --derive-candidate-counts --prior-attempts "${PRIOR_ATTEMPTS:-0}"
          python private-results/private_automation/scripts/build_results_index.py --provider chatgpt
          cd private-results
          git config --global --add safe.directory "$GITHUB_WORKSPACE/private-results"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "private_automation/queue/jobs/${JOB_ID}.json" "results/${result_slug}" results/README.md results/successful.csv
          git commit -m "private: save ChatGPT result ${JOB_ID} [skip ci]"
          for retry in 1 2 3 4 5; do
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              sleep 2
              continue
            fi
            if git push origin "HEAD:refs/heads/${TARGET_BRANCH}"; then
              echo "Saved ChatGPT candidate evidence to the private repository."
              exit 0
            fi
            sleep 2
          done
          echo "Could not save private ChatGPT evidence after five attempts."
          exit 1

      - name: Require three automated passes
        id: require_three
        if: always() && steps.validate_marker.outcome == 'success' && steps.private_target.outcome == 'success'
        env:
          SUCCESSFUL_COUNT: ${{ steps.generate.outputs.successful_count || '0' }}
          ATTEMPT_COUNT: ${{ steps.generate.outputs.attempt_count || '0' }}
          PRIVATE_EVIDENCE_SAVE_OUTCOME: ${{ steps.save_evidence.outcome || 'not_run' }}
        run: |
          if [[ "${SUCCESSFUL_COUNT:-0}" -lt 3 ]]; then
            echo "Only ${SUCCESSFUL_COUNT:-0}/3 complete candidates passed after ${ATTEMPT_COUNT:-0} attempts. Private evidence save step: ${PRIVATE_EVIDENCE_SAVE_OUTCOME:-unknown}."
            exit 1
          fi
          echo "Three complete candidates passed the automated gate. Human visual and image review remain pending."

      - name: Dispatch completed ChatGPT set to content-post
        if: steps.require_three.outcome == 'success'
        env:
          CONTENT_POST_DISPATCH_TOKEN: ${{ secrets.CONTENT_POST_DISPATCH_TOKEN }}
          JOB_ID: ${{ env.JOB_ID }}
          PRIVATE_SOURCE_ROOT: ${{ env.PRIVATE_SOURCE_ROOT }}
        run: |
          set -euo pipefail
          if [[ -z "$CONTENT_POST_DISPATCH_TOKEN" ]]; then
            echo "::warning::CONTENT_POST_DISPATCH_TOKEN is not configured; content-post dispatch was skipped."
            exit 0
          fi
          payload="$(python - <<'PY'
          import json, os, pathlib, re
          from urllib.parse import urlsplit
          job_path = pathlib.Path(os.environ["PRIVATE_SOURCE_ROOT"]) / "private_automation/queue/jobs" / f"{os.environ['JOB_ID']}.json"
          job = json.loads(job_path.read_text(encoding="utf-8"))
          website = (job.get("row") or {}).get("website", "").strip()
          hostname = (urlsplit(website if "://" in website else "https://" + website).hostname or "").lower().removeprefix("www.")
          site_slug = hostname.split(".")[0]
          if not website or not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", site_slug):
              raise SystemExit("The completed ChatGPT job has invalid publish details.")
